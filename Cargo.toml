[package]
name = "tree-sitter-dart"
description = "dart grammar for the tree-sitter parsing library"
version = "0.0.1"
keywords = ["incremental", "parsing", "dart"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/tree-sitter/tree-sitter-javascript"
edition = "2018"
license = "MIT"

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
# Relaxed from "0.22.6" so this grammar unifies with whatever tree-sitter core
# the consumer uses (gilda is on 0.26). The binding returns the FFI-transparent
# `Language`, which is ABI-stable across these versions.
tree-sitter = ">=0.22"

[build-dependencies]
cc = "1.0"
